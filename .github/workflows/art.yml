# Redraws the header picture from the contribution calendar once a day and
# publishes it to the `output` branch, which README.md reads from. Same
# pipeline as Platane/snk: generate, then force-push a one-commit branch so
# main does not collect a daily commit.
name: art

on:
  schedule:
    - cron: "17 16 * * *" # 00:17 in Beijing, just after the calendar day turns
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["art/**", ".github/workflows/art.yml"]

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: draw stream.svg and stream-dark.svg
        run: node art/render.mjs dist
        env:
          # The workflow token buckets days in UTC. A fine-grained token of
          # the profile owner (public read-only, no permissions) buckets them
          # in the owner's time zone, matching the calendar the owner sees.
          GITHUB_TOKEN: ${{ secrets.CAL_TOKEN || secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
      - name: publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
          commit_message: "art: redraw"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
